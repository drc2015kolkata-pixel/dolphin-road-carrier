<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dolphin Road Carriers 24K Gold Triangular DRC Logo">
  <defs>
    <linearGradient id="drcBgGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#0F2D75" />
      <stop offset="100%" stop-color="#051336" />
    </linearGradient>
    <linearGradient id="drcInnerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="drcGold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="22%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="78%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="drcGoldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="55%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="dolphinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Crisp Play-Store Style Rounded Square Backing -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#FFFFFF" />

  <!-- Outer 24K Gold Beveled Shield Triangle -->
  <path
    d="M 256 28
       C 278 28, 297 39, 309 58
       L 472 356
       C 487 383, 480 418, 454 434
       C 442 442, 428 446, 412 446
       L 100 446
       C 68 446, 42 420, 42 388
       C 42 376, 46 364, 53 356
       L 203 58
       C 215 39, 234 28, 256 28 Z"
    fill="url(#drcBgGrad)"
    stroke="url(#drcGold24k)"
    stroke-width="14"
  />

  <!-- Inner Double-Beveled 24K Gold Accent Trim -->
  <path
    d="M 256 54
       L 446 372
       C 453 383, 448 400, 434 409
       L 78 409
       C 64 400, 59 383, 66 372 Z"
    fill="url(#drcInnerGlow)"
    stroke="url(#drcGold24k)"
    stroke-opacity="0.72"
    stroke-width="3.5"
  />

  <!-- Dynamic Wave Speed Arc inside Triangle -->
  <path
    d="M 122 302
       C 178 278, 236 276, 296 292
       C 330 301, 362 294, 388 281
       C 358 310, 316 321, 274 312
       C 218 300, 168 302, 122 302 Z"
    fill="url(#drcGold24k)"
    opacity="0.92"
  />

  <!-- Sleek Jumping Dolphin Centered Cleanly Inside Triangle -->
  <path
    d="M 190 278
       C 186 240, 206 196, 248 168
       C 258 161, 267 156, 275 154
       C 264 142, 262 128, 269 116
       C 278 130, 286 144, 292 158
       C 312 167, 326 184, 332 204
       C 322 200, 311 200, 301 204
       C 291 188, 272 184, 254 195
       C 266 205, 272 217, 270 229
       C 258 218, 246 212, 234 214
       C 220 230, 214 250, 216 272
       C 226 277, 234 287, 238 296
       C 222 292, 210 286, 200 280
       C 188 292, 174 297, 158 295
       C 168 288, 180 283, 190 278 Z"
    fill="url(#dolphinBody)"
  />

  <!-- Dolphin Eye Accent -->
  <circle cx="301" cy="181" r="4.2" fill="#0F2D75" />

  <!-- Bold 24K Gold-Infused DRC Typography -->
  <text
    x="256"
    y="386"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-weight="900"
    font-size="86"
    letter-spacing="8"
    fill="url(#drcGoldText)"
  >
    DRC
  </text>

  <!-- Subtle 24K Gold Underline -->
  <rect x="148" y="400" width="216" height="6" rx="3" fill="url(#drcGold24k)" />
</svg>
